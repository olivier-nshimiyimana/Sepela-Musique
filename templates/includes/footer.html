{% load static ui_i18n %}
<style>
  /* Undo legacy styles.bundle.css #footer padding/margins (e.g. 8rem bottom) */
  #footer.smart-footer {
    margin: 28px auto max(10px, env(safe-area-inset-bottom)) !important;
    padding: 0 !important;
    text-align: center !important;
    width: min(880px, calc(100% - 24px));
    border: 1px solid rgba(139, 92, 246, 0.22) !important;
    border-radius: 12px !important;
    background: rgba(14, 12, 22, 0.72) !important;
    background-image: none !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35) !important;
    position: relative !important;
    z-index: 5 !important;
    overflow: hidden;
  }
  #footer.smart-footer::before,
  #footer.smart-footer::after {
    content: none !important;
    display: none !important;
    background: none !important;
  }
  #footer .sf-wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 14px 16px 13px;
    color: #e8e8f0;
    font-family: "DM Sans", system-ui, sans-serif;
  }
  /* One compact row: label + icons */
  #footer .sf-main-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
    margin: 0;
  }
  #footer .sf-follow-label {
    margin: 0;
    color: rgba(196, 181, 253, 0.75);
    font-size: 10px;
    letter-spacing: 0.14em;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #footer .sf-icons {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 7px;
  }
  #footer .sf-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid rgba(167, 139, 250, 0.22);
    background: rgba(124, 58, 237, 0.12);
    color: rgba(241, 245, 255, 0.92);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }
  #footer .sf-icon:hover {
    background: rgba(124, 58, 237, 0.28);
    border-color: rgba(167, 139, 250, 0.45);
    color: #fff;
  }
  #footer .sf-icon svg {
    width: 14px;
    height: 14px;
    opacity: 0.95;
  }
  /* Single calm meta line */
  #footer .sf-meta-row {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 8px;
    font-size: 11px;
    line-height: 1.4;
    color: rgba(200, 205, 230, 0.72);
  }
  #footer .sf-meta-row .sf-copy {
    margin: 0;
    white-space: nowrap;
  }
  #footer .sf-meta-row .sf-sep {
    color: rgba(167, 139, 250, 0.35);
    user-select: none;
  }
  #footer .sf-meta-row a {
    color: rgba(216, 232, 255, 0.82);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  #footer .sf-meta-row a:hover {
    color: #a5f3fc;
  }
  #footer .sf-mk-footline {
    margin: 10px auto 0;
    max-width: 36rem;
    text-align: center;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(200, 205, 230, 0.55);
  }
  @media (min-width: 641px) {
    #footer.smart-footer {
      margin-top: 36px !important;
      border-radius: 14px !important;
    }
    #footer .sf-wrap {
      padding: 16px 20px 15px;
    }
    #footer .sf-follow-label {
      font-size: 11px;
      letter-spacing: 0.15em;
    }
    #footer .sf-icon {
      width: 38px;
      height: 38px;
    }
    #footer .sf-icon svg {
      width: 15px;
      height: 15px;
    }
    #footer .sf-meta-row {
      font-size: 12px;
      margin-top: 12px;
      padding-top: 11px;
    }
  }
  @media (max-width: 640px) {
    #footer.smart-footer {
      width: calc(100% - 16px);
      border-radius: 11px !important;
      margin-top: 20px !important;
    }
    #footer .sf-wrap {
      padding: 12px 12px 11px;
    }
    #footer .sf-icons {
      gap: 6px;
    }
    #footer .sf-icon {
      width: 33px;
      height: 33px;
      border-radius: 8px;
    }
    #footer .sf-icon svg {
      width: 13px;
      height: 13px;
    }
    #footer .sf-meta-row {
      margin-top: 9px;
      padding-top: 9px;
      gap: 5px 6px;
    }
  }
</style>

        <div class="sf-meta-row" aria-label="Copyright and links">
            <span class="sf-copy">&copy; {% now "Y" %} {{ site_settings.site_title|default:"Sepela Musique" }}. {% ui 'all_rights_reserved' %}</span>
            <span class="sf-sep" aria-hidden="true">·</span>
            <a href="{% url 'core:home' %}">{% ui 'home' %}</a>
            <span class="sf-sep" aria-hidden="true">·</span>
            <a href="{% url 'core:about' %}">{% ui 'about_us' %}</a>

        {% if SITE_MODE == 'MISS_KATANGA' %}

    </div>
</footer>
