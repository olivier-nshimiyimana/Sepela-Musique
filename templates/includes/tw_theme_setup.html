{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    prefix: 'tw-',
    theme: {
      extend: {
        fontFamily: {
          display: ['Syne', 'system-ui', 'sans-serif'],
          sans: ['DM Sans', 'system-ui', 'sans-serif'],
        },
        animation: {
          'fade-up': 'twFadeUp 0.65s ease-out forwards',
          'fade-up-delay': 'twFadeUp 0.65s ease-out 0.12s forwards',
        },
        keyframes: {
          twFadeUp: {
            '0%': { opacity: '0', transform: 'translateY(14px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="{% static 'css/tw-premium-shell.css' %}">
